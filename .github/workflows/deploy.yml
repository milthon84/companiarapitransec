name: CI/CD Deploy to cPanel (React & Node.js)

on:
  push:
    branches:
      - main
      - master

jobs:
  # ==========================================
  # 1. DESPLIEGUE DEL BACKEND (Node.js)
  # ==========================================
  deploy-backend:
    name: Desplegar Backend Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Subir archivos del Backend por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./api/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Instalar dependencias en cPanel y reiniciar Passenger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          script: |
            cd ~/api
            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt

  # ==========================================
  # 2. DESPLIEGUE DEL FRONTEND (React Vite)
  # ==========================================
  deploy-frontend:
    name: Desplegar Frontend React
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y Compilar React
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Subir Frontend a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./public_html/
